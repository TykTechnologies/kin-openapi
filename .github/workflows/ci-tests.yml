name: Run tests

on:
  pull_request:
  push:
    branches:
      - release-5.8

env:
  TIMEOUT: 20m
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }} # base_ref for PRs is 'release-5.8', but merges read in ref_name

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      - name: "Checkout PR"
        uses: TykTechnologies/github-actions/.github/actions/checkout-pr@895df6aef134e6fa49a25fca3b60ba089671eb43 # main @ 2026-09-17
        with:
          # The built-in token is enough: this repo is public, has no submodules
          # and no LFS, and the PR head is a branch in this same repo. It must be
          # passed explicitly -- checkout-pr forwards `token` straight to
          # actions/checkout, so leaving it unset supplies an empty string rather
          # than falling back to the default.
          #
          # This replaces secrets.ORG_GH_TOKEN, which was migrated org-wide from a
          # PAT to a GitHub App while this repo's Actions were disabled, and so no
          # longer resolves here.
          token: ${{ github.token }}

      - name: "Get base ref"
        run: |
          git fetch origin ${{ env.BRANCH_NAME }}
          git rev-parse origin/${{ env.BRANCH_NAME }}

      - name: Setup Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        timeout-minutes: 20
        with:
          # v2.8.0 is built with go1.25 and refuses to run against this
          # module's `go 1.26.5` directive: "the Go language version (go1.25)
          # used to build golangci-lint is lower than the targeted Go version".
          # v2.13.0 is built with go1.27.
          version: v2.13.0
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # Output formats configured in .golangci.yml (v2 approach)
          # Generates: text to stdout + checkstyle JSON for SonarQube
          args: -v ./...
          skip-cache: false
          skip-save-cache: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: golangcilint
          retention-days: 1
          path: |
            golangci-lint-report.json

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest-version: ${{ steps.get-latest-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.24.x

      - name: Run unit tests
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./...
